name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions are in sync
        run: |
          pkg=$(node -p "require('./package.json').version")
          cargo=$(awk -F'"' '/^version *=/{print $2; exit}' src-tauri/Cargo.toml)
          echo "package.json=$pkg Cargo.toml=$cargo"
          [ "$pkg" = "$cargo" ] || { echo "::error::Bump package.json and src-tauri/Cargo.toml together"; exit 1; }

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm run check
      - run: npm run build

      # tauri-build requires the externalBin sidecar to exist; use the system ffmpeg.
      - name: Provide ffmpeg sidecar
        run: |
          mkdir -p src-tauri/binaries
          cp "$(which ffmpeg)" "src-tauri/binaries/ffmpeg-$(rustc -vV | awk '/host:/{print $2}')"

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
